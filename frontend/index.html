<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подбор подрядчиков</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23004357'/%3E%3Cpath d='M13 24l8 8 16-16' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div class="brand-text">
          <h1>Подбор подрядчиков</h1>
          <p class="sub">До 3 подрядчиков из каталога города и объяснение, почему каждый подходит</p>
        </div>
      </div>
      <label class="switch" title="Работать без бэкенда, на локальных примерах">
        <span class="switch-label">Демо-режим</span>
        <input type="checkbox" id="demoMode" role="switch">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      </label>
    </div>
  </header>

  <div class="layout">
    <!-- Левая колонка: форма поиска -->
    <aside class="sidebar">
      <form id="form" class="form" aria-label="Параметры заказа">
        <div class="form-head">
          <h2>Параметры ивента</h2>
          <p>Алгоритм выберет максимум 3 лучших совпадения</p>
        </div>

        <div class="field">
          <label for="city">Город проведения</label>
          <div class="input-wrap">
            <svg class="in-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <select name="city" id="city" required></select>
          </div>
        </div>
        <div class="field">
          <label for="date">Дата события</label>
          <div class="input-wrap">
            <svg class="in-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <input type="date" name="date" id="date" min="2026-09-23" max="2026-12-31" required>
          </div>
        </div>
        <div class="field">
          <label for="event_type">Формат события</label>
          <div class="input-wrap">
            <svg class="in-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 14 10M14 4v2M20 10h-2M18.5 5.5 17 7M9 4.5 10 6M19.5 15 18 14"/></svg>
            <select name="event_type" id="event_type" required></select>
          </div>
        </div>
        <div class="field">
          <label for="category">Категория специалиста</label>
          <div class="input-wrap">
            <svg class="in-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <select name="category" id="category" required></select>
          </div>
        </div>
        <div class="field">
          <div class="label-line">
            <label for="budget_kzt">Максимальный бюджет</label>
            <span class="label-hint" id="budgetHint"></span>
          </div>
          <div class="input-wrap has-suffix">
            <svg class="in-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
            <input type="number" name="budget_kzt" id="budget_kzt" min="1" step="1000" inputmode="numeric" required placeholder="например, 500000">
            <span class="suffix" aria-hidden="true">₸</span>
          </div>
        </div>
        <div class="field">
          <label for="hours">Длительность программы, ч <span class="opt">необяз.</span></label>
          <div class="input-wrap">
            <svg class="in-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <input type="number" name="hours" id="hours" min="1" max="24" inputmode="numeric" placeholder="например, 6">
          </div>
        </div>
        <div class="field">
          <span class="field-label" id="langLabel">Язык ведения <span class="opt">необяз.</span></span>
          <!-- Чипы управляют скрытым select#language: API принимает один язык -->
          <div class="lang-chips" id="langChips" role="radiogroup" aria-labelledby="langLabel"></div>
          <select name="language" id="language" hidden></select>
        </div>

        <button type="submit" id="submitBtn" class="primary">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>
          <span id="submitText">Подобрать</span>
        </button>
      </form>
      <!-- Когда никто не подошёл: форма сворачивается в сводку условий (заполняет app.js) -->
      <section id="querySummary" class="query-summary" hidden></section>
    </aside>

    <!-- Правая колонка: демо-запросы и результаты -->
    <main class="content">
      <section class="shortcuts" aria-label="Быстрые демо-запросы">
        <span class="shortcuts-label">Быстрые демо-запросы</span>
        <div class="chips-scroll">
          <button type="button" data-preset="dense">1 · Популярная категория, осень</button>
          <button type="button" data-preset="rare">2 · Редкая категория</button>
          <button type="button" data-preset="december">3 · То же, что №1, но в декабре</button>
          <button type="button" data-preset="nofit">4 · Кандидаты есть, но не подходят</button>
          <button type="button" data-preset="empty">5 · Категории нет в городе</button>
        </div>
      </section>

      <div id="error" class="error" role="alert" hidden></div>
      <div id="results" aria-live="polite">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <p>Заполните параметры заказа или выберите демо-запрос</p>
        </div>
      </div>
    </main>
  </div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
